[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "elara"
version = "0.1.0"
description = "PC software for the ELARA ELF (Schumann resonance) receiver: capture, mains cancellation, spectra and mode fitting"
readme = "README.md"
license = { text = "CERN-OHL-W-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
audio = ["soundfile>=0.12", "sounddevice>=0.4"]
hdf5 = ["h5py>=3.8"]
test = ["pytest>=7"]
all = ["soundfile>=0.12", "sounddevice>=0.4", "h5py>=3.8", "pytest>=7"]

[project.scripts]
elara = "elara.cli:main"

[tool.setuptools]
packages = ["elara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
