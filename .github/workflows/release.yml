# SPDX-License-Identifier: CERN-OHL-W-2.0
# Tag a revision (git tag v0.2.1 && git push --tags) to publish its manufacturing
# package: Gerbers, drill, pick-and-place, BOMs, PDFs, STEP and the order lists.
# The fab outputs are committed by tools/fab_outputs.sh; this only bundles them.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the fab outputs
        run: |
          mkdir -p dist
          for b in antenna_amplifier acdc_converter plate_capacitor; do
            (cd PCB/$b && zip -qr ../../dist/elara-${b}-${GITHUB_REF_NAME}.zip fab)
          done
          zip -qr dist/elara-bom-${GITHUB_REF_NAME}.zip bom ASSEMBLY.md
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
